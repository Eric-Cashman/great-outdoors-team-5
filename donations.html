<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Page</title>
    <link rel="stylesheet" href="styles/donationstyles.css">
</head>
<header>
    <div class="inner-header">
    </div> 
    <nav id="primary">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="donate.html">Donate</a></li>
        </ul>
    </nav>
</header>
<body>
  <div class="container">
    <h2>Support Our Mission!</h2>
    <p>While donations are not required, if you want to help support us, donations are appreciated! </p>
    <p> Accepted: Visa, Mastercard, American Express, Discover, Paypal </p>
    <form action="/donate" method="POST">
<div class="form-name">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Your Name" required />
</div>

<div class="form-email">
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" placeholder="Email Address" required />
</div>

<div class="form-amount">
  <label for="amount">Donation Amount (USD):</label>
  <input type="number" id="amount" name="amount" placeholder="Donation Amount" required />
</div>

<div class="form-payment-method">
  <label for="paymentMethod">Payment Method:</label>
  <select id="paymentMethod" name="paymentMethod" required>
    <option value="">-- Select a payment method --</option>
    <option value="Visa">Visa</option>
    <option value="MasterCard">MasterCard</option>
    <option value="American Express">American Express</option>
    <option value="Discover">Discover</option>
    <option value="PayPal">PayPal</option>
  </select>
</div>

<div class="form-payment-details">
  <label for="paymentDetails">Payment Details:</label>
  <input type="text" id="paymentDetails" name="paymentDetails" placeholder="Card Number or PayPal Email" required />
</div>

<a href="Thanks.html" class="button">Donate</a>

    </form>
  </div>
</body>
<footer>

    </ul>
    </footer>
</html>
